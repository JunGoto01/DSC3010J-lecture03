<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="DSC3010J第3回 Titanic classroom competition 公開ランキング">
  <title>公開ランキング｜DSC3010J Titanic Challenge</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230d3159'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Arial,sans-serif' font-size='34' font-weight='700' fill='white'%3ER%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=20260827-beginner1">
</head>
<body class="leaderboard-page">
  <header class="leaderboard-hero">
    <div class="content-width">
      <p class="eyebrow">DSC3010J · LECTURE 03 · PUBLIC LEADERBOARD</p>
      <h1>Titanic Challenge</h1>
      <p>全員が同じランキングを見ている。入力したニックネームは公開・保存される。実名、学籍番号、メールアドレスはニックネームに入れないこと。</p>
    </div>
  </header>

  <main class="leaderboard-main content-width">
    <section class="leaderboard-card" aria-labelledby="board-title">
      <div class="leaderboard-toolbar">
        <div>
          <p class="section-label">LIVE · 15秒ごとに自動更新</p>
          <h2 id="board-title">Best score by nickname</h2>
          <p id="leaderboard-status" class="board-status" aria-live="polite">ランキングを読み込み中…</p>
        </div>
        <button class="button button--quiet" id="refresh-leaderboard" type="button">今すぐ更新</button>
      </div>
      <p id="leaderboard-empty">まだ公式提出はない。</p>
      <div class="table-scroll">
        <table>
          <thead><tr><th>Rank</th><th>Nickname</th><th>Best round</th><th>Score</th><th>Correct</th><th>Receipt</th></tr></thead>
          <tbody id="leaderboard-body"></tbody>
        </table>
      </div>
      <div class="leaderboard-actions">
        <button class="button button--quiet" id="export-leaderboard" type="button">CSVで保存</button>
        <a class="button button--quiet" href="index.html#submit">分析・提出ページへ戻る</a>
      </div>
    </section>
  </main>

  <script src="competition-data.js?v=20260827-beginner1"></script>
  <script src="api-config.js?v=20260827-beginner1"></script>
  <script src="competition-api.js?v=20260828-plain1"></script>
  <script src="leaderboard.js?v=20260828-plain1"></script>
</body>
</html>
